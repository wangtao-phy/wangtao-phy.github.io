<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">
  
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,700;1,400;1,700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="{{ '/assets/css/academic.css' | relative_url }}">
  <script defer src="https://use.fontawesome.com/releases/v5.0.12/js/all.js"></script>
  <script defer src="https://cn.vercount.one/js"></script>

  {% if page.math or layout.math %}
  <script type="text/x-mathjax-config">
    MathJax.Hub.Config({
      TeX: { equationNumbers: { autoNumber: "AMS" } },
      extensions: ["tex2jax.js"],
      jax: ["input/TeX", "output/HTML-CSS"],
      tex2jax: {
        inlineMath: [ ['$','$'], ["\\(","\\)"] ],
        displayMath: [ ['$$','$$'], ["\\[","\\]"] ],
        processEscapes: true
      }
    });
  </script>
  <script type="text/javascript" async src="https://cdn.jsdelivr.net/npm/mathjax@2/MathJax.js?config=TeX-MML-AM_CHTML"></script>
  {% endif %}
</head>

<body>
  <div class="app-container">
    <!-- Modern Glassmorphism Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-content">
        <div class="avatar-container">
          <img src="{{ '/assets/bp.jpeg' | relative_url }}" alt="{{ site.title }}" class="avatar">
        </div>
        <h1 class="site-title"><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
        <p class="site-description">{{ site.description }}</p>
        
        <nav class="main-nav">
          {% for item in site.data.navigation %}
            <a href="{{ item.url | relative_url }}" class="nav-item {% if page.url == item.url %}active{% endif %}">
              {{ item.title }}
            </a>
          {% endfor %}
        </nav>

        <div class="sidebar-footer">
          <span id="vercount_value_site_uv"></span> Visitors
        </div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="content-area">
      <div class="content-wrapper animate-fade-in-up">
        {% if page.title and page.layout != 'home' and page.url != '/' %}
          <header class="page-header">
            <h1 class="page-title">{{ page.title }}</h1>
          </header>
        {% endif %}
        
        <div class="page-content">
          {{ content }}
        </div>
      </div>
    </main>
  </div>
</body>
</html>
