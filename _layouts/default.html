<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">
  
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  
  <link rel="icon" type="image/png" href="{{ '/assets/favicon.png' | relative_url }}?v={{ site.time | date: '%s' }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,700;1,400;1,700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="{{ '/assets/css/academic.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  <script defer src="https://use.fontawesome.com/releases/v5.0.12/js/all.js"></script>
  <script defer src="https://cn.vercount.one/js"></script>

  <script type="text/x-mathjax-config">
    MathJax.Hub.Config({
      TeX: { equationNumbers: { autoNumber: "AMS" } },
      extensions: ["tex2jax.js"],
      jax: ["input/TeX", "output/HTML-CSS"],
      tex2jax: {
        inlineMath: [ ['$','$'], ["\\(","\\)"] ],
        displayMath: [ ['$$','$$'], ["\\[","\\]"] ],
        processEscapes: true
      }
    });
  </script>
  <script type="text/javascript" async src="https://cdn.jsdelivr.net/npm/mathjax@2/MathJax.js?config=TeX-MML-AM_CHTML"></script>
</head>

<body>
  <!-- Interactive Particles Background -->
  <div id="tsparticles-purple" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2;"></div>

  <div class="app-container">
    <!-- Modern Glassmorphism Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-content">
        <div class="avatar-container">
          <img src="{{ '/assets/bp.jpeg' | relative_url }}" alt="{{ site.title }}" class="avatar">
        </div>
        <h1 class="site-title"><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
        <p class="site-description">{{ site.description }}</p>
        
        <nav class="main-nav">
          {% for item in site.data.navigation %}
            <a href="{{ item.url | relative_url }}" class="nav-item {% if page.url == item.url %}active{% endif %}">
              {{ item.title }}
            </a>
          {% endfor %}
        </nav>

        <div class="sidebar-footer">
          <span id="vercount_value_site_uv"></span> Visitors
        </div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="content-area">
      <div class="content-wrapper animate-fade-in-up">
        <div class="page-content">
          {{ content }}
        </div>
      </div>
    </main>
  </div>

  <script>
    // Automatically open external links in a new tab
    document.addEventListener("DOMContentLoaded", function() {
      var links = document.links;
      for (var i = 0; i < links.length; i++) {
        if (links[i].hostname != window.location.hostname) {
          links[i].target = '_blank';
          links[i].rel = 'noopener noreferrer';
        }
      }
    });
  </script>

  <!-- tsParticles Configuration -->
  <script src="https://cdn.jsdelivr.net/npm/tsparticles-slim@2.0.6/tsparticles.slim.bundle.min.js"></script>
  <script>
    // 1. Subtle Background Particles (120, smaller, background, no mouse effect)
    tsParticles.load("tsparticles-purple", {
      fpsLimit: 60,
      particles: {
        color: { value: ["#e5e7eb", "#d1d5db"] }, /* Minimalist subtle grey */
        links: {
          color: "#e5e7eb",
          distance: 120,
          enable: true,
          opacity: 0.5,
          width: 1
        },
        move: {
          direction: "none",
          enable: true,
          outModes: { default: "bounce" },
          random: true,
          speed: 0.8,
          straight: false
        },
        number: {
          density: { enable: true, area: 800 },
          value: 120
        },
        opacity: { value: 0.4 },
        shape: { type: "circle" },
        size: { value: { min: 1, max: 2 } }
      },
      detectRetina: true
    });
  </script>
</body>
</html>
