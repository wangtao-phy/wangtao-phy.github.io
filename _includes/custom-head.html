  TeX: { equationNumbers: { autoNumber: "AMS" } },
  extensions: ["tex2jax.js"],

  tex2jax: {
    inlineMath: [ ['$','$'], ["\\(","\\)"] ],

    processEscapes: true,
    "HTML-CSS": { fonts: ["TeX"] }
  }
});
</script>

  src="https://cdn.jsdelivr.net/npm/mathjax@2/MathJax.js?config=TeX-MML-AM_CHTML">
</script>
